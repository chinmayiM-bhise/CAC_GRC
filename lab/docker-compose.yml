version: '3.8'

services:
  # Target 2: Enterprise Database (PostgreSQL 16)
  target-db:
    image: postgres:16-alpine
    container_name: cac-target-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: auditpassword
      POSTGRES_DB: enterprisedb
    ports:
      - "5433:5432"
    volumes:
      - target_db_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  target_db_data:
